name: Build APK

on:
  push:
    branches: [ "arena/e7d92f65-floating-power-button-v2", "PC", "main", "master" ]
  workflow_dispatch:
    inputs:
      test_ads:
        description: "Use Huawei TEST ad slot in this release build"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Unit tests
        run: flutter test

      - name: Build release APKs (split per ABI)
        run: |
          ARGS="--release --split-per-abi --obfuscate --split-debug-info=build/symbols"
          if [ "${{ inputs.test_ads }}" = "true" ]; then
            ARGS="$ARGS --dart-define=PETAL_USE_TEST_ADS=true"
          fi
          flutter build apk $ARGS

      - name: Show APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: power-volume-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
