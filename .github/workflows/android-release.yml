name: Android release APK

# Release signing secrets are deliberately not exposed to pull requests.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEY_ALIAS: androiddebugkey
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SHA256: 6D982893A5CF58F3C82E8CF3ECA793013A49007AFF1670EE338484544A996D8C
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Check and decode the existing signing key
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ENCODED_KEYSTORE" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'Missing signing secrets. See docs/github-release-vi.md.' >&2
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/power-volume-signing.keystore"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          fingerprint=$(keytool -list -v -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD | awk -F'SHA256: ' '/SHA256: / {print $2; exit}' | tr -d ': \r\n' | tr '[:lower:]' '[:upper:]')
          if [[ "$fingerprint" != "$EXPECTED_SHA256" ]]; then
            echo 'Keystore certificate does not match the expected existing signing key.' >&2
            exit 1
          fi
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run tests
        run: flutter test
      - name: Build universal release APK
        run: |
          chmod +x android/gradlew
          flutter build apk --release
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          apk=build/app/outputs/flutter-apk/app-release.apk
          output=$("$apksigner" verify --verbose --print-certs "$apk")
          fingerprint=$(printf '%s\n' "$output" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ': \r\n' | tr '[:lower:]' '[:upper:]')
          if [[ "$fingerprint" != "$EXPECTED_SHA256" ]]; then
            echo 'APK signature does not match the expected existing signing key.' >&2
            exit 1
          fi
          echo 'APK signature matches the expected signing certificate.'
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Power-Volume-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/power-volume-signing.keystore"
