name: Android release APK

# Release signing secrets are deliberately not exposed to pull requests.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SHA256: 6D982893A5CF58F3C82E8CF3ECA793013A49007AFF1670EE338484544A996D8C
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Check and decode the existing signing key
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in ENCODED_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              case "$name" in
                ENCODED_KEYSTORE) secret_name=ANDROID_KEYSTORE_BASE64 ;;
                ANDROID_KEYSTORE_PASSWORD) secret_name=ANDROID_STORE_PASSWORD ;;
                *) secret_name="$name" ;;
              esac
              echo "::error::Missing GitHub Actions secret: $secret_name"
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then exit 1; fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/power-volume-signing.keystore"
          if ! printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$KEYSTORE"; then
            echo '::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Recreate it from the existing keystore.'
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          if ! keytool_output=$(keytool -list -v -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD 2>/dev/null); then
            echo '::error::Cannot read the keystore with the specified store password and alias. Check the keystore, ANDROID_STORE_PASSWORD, and ANDROID_KEY_ALIAS.'
            exit 1
          fi
          fingerprint=$(printf '%s\n' "$keytool_output" | awk -F'SHA256: ' '/SHA256: / {print $2; exit}' | tr -d ': \r\n' | tr '[:lower:]' '[:upper:]')
          if [[ "$fingerprint" != "$EXPECTED_SHA256" ]]; then
            echo '::error::Keystore certificate does not match the expected existing signing key.'
            exit 1
          fi
      - name: Get dependencies
        run: flutter pub get
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/flutter-tests.log"; then
            tail -n 80 "$RUNNER_TEMP/flutter-tests.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Build universal release APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x android/gradlew
          if ! flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/android-build.log"; then
            python3 -c 'import sys; text="".join(open(sys.argv[1], errors="replace").readlines()[-100:]); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' "$RUNNER_TEMP/android-build.log"
            exit 1
          fi
      - name: Summarize merged manifest for privacy review
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as E
          p = 'build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml'
          root = E.parse(p).getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          rows = ['Permissions:'] + [x.get(ns+'name', '') for x in root.findall('uses-permission')]
          rows += ['Providers:'] + [x.get(ns+'name', '') for x in root.findall('./application/provider')]
          print('::notice::' + '\n'.join(rows).replace('%', '%25').replace('\n', '%0A'))
          PYCODE
      - name: Upload merged Android manifest for privacy review
        uses: actions/upload-artifact@v4
        with:
          name: Power-Volume-merged-manifest
          path: build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ -z "$apksigner" ]]; then
            echo '::error::Android apksigner was not found in the SDK build-tools.'
            exit 1
          fi
          apk=build/app/outputs/flutter-apk/app-release.apk
          if ! output=$("$apksigner" verify --verbose --print-certs "$apk" 2>&1); then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$output"
            echo '::error::apksigner could not verify the APK.'
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -qx 'Number of signers: 1'; then
            echo '::error::APK must have exactly one signer.'
            exit 1
          fi
          # Build-tools 36 prints "Signer #1"; 37 prints "V2 Signer:".
          mapfile -t fingerprints < <(printf '%s\n' "$output" | awk '
            /^(Signer( \([^)]*\))? #[0-9]+|V[0-9.]+ Signer( #[0-9]+)?):? certificate SHA-256 digest:/ {
              sub(/^.*certificate SHA-256 digest:[[:space:]]*/, "")
              print
            }' | tr -d ': \r' | tr '[:lower:]' '[:upper:]' | sort -u)
          if [[ ${#fingerprints[@]} -ne 1 || "${fingerprints[0]}" != "$EXPECTED_SHA256" ]]; then
            echo '::error::APK signer certificate missing or does not match the existing signing key.'
            exit 1
          fi
          echo 'APK signature matches the expected signing certificate.'
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Power-Volume-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build signed APK with Huawei test banner
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release --dart-define=PETAL_ADS_TEST=true 2>&1 | tee "$RUNNER_TEMP/android-test-build.log"; then
            python3 -c 'import sys; text="".join(open(sys.argv[1], errors="replace").readlines()[-100:]); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' "$RUNNER_TEMP/android-test-build.log"
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/Power-Volume-test-ads.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          output=$("$apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Power-Volume-test-ads.apk")
          printf '%s\n' "$output" | grep -qx 'Number of signers: 1'
          fingerprint=$(printf '%s\n' "$output" | awk '/^(Signer( \([^)]*\))? #[0-9]+|V[0-9.]+ Signer( #[0-9]+)?):? certificate SHA-256 digest:/ {sub(/^.*certificate SHA-256 digest:[[:space:]]*/, ""); print; exit}' | tr -d ': \r' | tr '[:lower:]' '[:upper:]')
          if [[ "$fingerprint" != "$EXPECTED_SHA256" ]]; then
            echo '::error::Test APK signer certificate missing or does not match the existing signing key.'
            exit 1
          fi
      - name: Upload test-banner APK
        uses: actions/upload-artifact@v4
        with:
          name: Power-Volume-test-banner-apk
          path: ${{ runner.temp }}/Power-Volume-test-ads.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/power-volume-signing.keystore"
